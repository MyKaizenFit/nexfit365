# TEMPLATE / NO APLICADO
# No instalar en /etc/nginx. No ejecutar nginx -t, reload ni certbot.
#
# Destino previsto (cutover, archivo NUEVO):
#   /etc/nginx/sites-available/nexfit-metodosk.conf
#   ln -s ... sites-enabled/nexfit-metodosk.conf
#
# NO sobrescribir /etc/nginx/sites-enabled/nexfit365.conf
# (nexfit365.dpdns.org + api.nexfit365.dpdns.org deben seguir vivos).
#
# sites-available/nexfit365.conf está DESACTUALIZADO (puerto 3001).
# La config viva es sites-enabled/nexfit365.conf.
#
# Origin: origin-nexfit.metodosk.com  (Cloudflare proxied + Worker + origin token)
# Uploads: uploads.metodosk.com       (DNS-only, Let's Encrypt, sin Worker)
# Landing: https://metodosk.com/      (Cloudflare; Nginx NO la sirve)
#
# TLS origin recomendado: Cloudflare Origin Certificate (Full strict)
#   /etc/ssl/cloudflare/origin-nexfit.pem
#   /etc/ssl/cloudflare/origin-nexfit.key
# Fallback origin: Let's Encrypt (solo si se prueba DNS-only temporal)
#
# TLS uploads: Let's Encrypt obligatorio (navegador directo)
#   /etc/letsencrypt/live/uploads.metodosk.com/{fullchain,privkey}.pem
#
# Origin gate: snippets/nexfit-origin-token-check.conf
# Placeholder __NEXFIT_ORIGIN_TOKEN__ — nunca versionar el valor real.
#
# Healthchecks Docker pegan a localhost:3000 (o /nexfit/), no a este server.

# --- HTTP: ACME (uploads) + redirect ---
server {
    listen 80;
    listen [::]:80;
    server_name origin-nexfit.metodosk.com uploads.metodosk.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# =============================================================================
# origin-nexfit.metodosk.com
# Worker → este host → Next (3000) / Django (8000) / media en disco
#
# Host hacia las apps: metodosk.com (nunca origin-nexfit.metodosk.com).
# X-Forwarded-Proto se fuerza a https.
# real_ip solo en este server block (misma lista que nexfit365.conf actual).
# =============================================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name origin-nexfit.metodosk.com;

    # RECOMENDADO: Cloudflare Origin Certificate
    ssl_certificate     /etc/ssl/cloudflare/origin-nexfit.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin-nexfit.key;
    # Fallback LE (no usar a la vez):
    # ssl_certificate     /etc/letsencrypt/live/origin-nexfit.metodosk.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/origin-nexfit.metodosk.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 300M;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    real_ip_header CF-Connecting-IP;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;

    set $public_host metodosk.com;

    include /etc/nginx/snippets/nexfit-maintenance-server.conf;

    location = /nexfit {
        include /etc/nginx/snippets/nexfit-origin-token-check.conf;
        return 301 /nexfit/;
    }

    # PII: 403 siempre (con o sin token). URLs firmadas van por /nexfit/api/.
    location /nexfit/media/progress_photos/ {
        return 403;
    }

    location /nexfit/media/profile_pictures/ {
        return 403;
    }

    location /nexfit/media/ {
        include /etc/nginx/snippets/nexfit-origin-token-check.conf;
        alias /srv/mykaizenfit/pro/data/media/;
        expires 1y;
        add_header Cache-Control "public";
    }

    # /nexfit/api/* → Django /api/*  (quita solo el prefijo /nexfit)
    location /nexfit/api/ {
        include /etc/nginx/snippets/nexfit-origin-token-check.conf;
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $public_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $public_host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header CF-Ray $http_cf_ray;
        proxy_set_header CF-Visitor $http_cf_visitor;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        client_max_body_size 300M;
    }

    # /nexfit, /nexfit/, /nexfit/_next/*, /nexfit/sw.js, manifest → Next
    location /nexfit/ {
        include /etc/nginx/snippets/nexfit-origin-token-check.conf;
        include /etc/nginx/snippets/nexfit-maintenance-location.conf;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $public_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $public_host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header CF-Ray $http_cf_ray;
        proxy_set_header CF-Visitor $http_cf_visitor;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location / {
        return 404;
    }
}

# =============================================================================
# uploads.metodosk.com  (DNS-only, sin proxy Cloudflare, sin Worker)
# Acceso directo del navegador. NO exige X-Nexfit-Origin-Token.
# Solo OPTIONS/POST al upload de vídeo de ejercicios.
# =============================================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name uploads.metodosk.com;

    ssl_certificate /etc/letsencrypt/live/uploads.metodosk.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/uploads.metodosk.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 300M;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    # DNS-only: IP del cliente es $remote_addr real. No usar CF-Connecting-IP.

    location ~ ^/nexfit/api/admin/exercises/[^/]+/upload-video/?$ {
        limit_except POST OPTIONS {
            deny all;
        }
        rewrite ^/nexfit/api/(.*)$ /api/$1 break;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host uploads.metodosk.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host uploads.metodosk.com;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Origin $http_origin;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        client_max_body_size 300M;
    }

    location / {
        return 404;
    }
}
