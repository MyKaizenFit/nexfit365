# TEMPLATE / NO APLICADO
# No instalar en /etc/nginx. No ejecutar nginx reload ni certbot.
#
# Origen NexFit detrás del Cloudflare Worker:
#   origin-nexfit.metodosk.com  →  este VPS
#
# Nginx NO sirve la landing metodosk.com/.
# Cloudflare sigue sirviendo https://metodosk.com/
#
# Origin gate: cada location /nexfit (excepto 403 de PII) incluye
# snippets/nexfit-origin-token-check.conf con el placeholder
# __NEXFIT_ORIGIN_TOKEN__. Copiar a /etc/nginx/snippets/ y sustituir
# el placeholder con el secreto local. Nunca versionar el valor real.
#
# Healthchecks Docker pegan a http://localhost:3000/ (o /nexfit/),
# no a este server block.

# --- HTTP: ACME + redirect (certbot ajustará el bloque SSL) ---
server {
    listen 80;
    listen [::]:80;
    server_name origin-nexfit.metodosk.com uploads.metodosk.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# =============================================================================
# origin-nexfit.metodosk.com
# Worker → este host → Next (3000) / Django (8000) / media en disco
#
# Host hacia las apps: metodosk.com (nunca origin-nexfit.metodosk.com).
# X-Forwarded-Proto se fuerza a https (no se confía el header del cliente).
# CF-Connecting-IP solo se usa como real_ip desde rangos Cloudflare.
# =============================================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name origin-nexfit.metodosk.com;

    # PLACEHOLDER: certbot --nginx -d origin-nexfit.metodosk.com
    ssl_certificate /etc/letsencrypt/live/origin-nexfit.metodosk.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/origin-nexfit.metodosk.com/privkey.pem;

    client_max_body_size 300M;

    real_ip_header CF-Connecting-IP;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;

    set $public_host metodosk.com;

    location = /nexfit {
        include /etc/nginx/snippets/nexfit-origin-token-check.conf;
        return 301 /nexfit/;
    }

    location /nexfit/media/progress_photos/ {
        return 403;
    }

    location /nexfit/media/profile_pictures/ {
        return 403;
    }

    location /nexfit/media/ {
        include /etc/nginx/snippets/nexfit-origin-token-check.conf;
        alias /srv/mykaizenfit/pro/data/media/;
        expires 1y;
        add_header Cache-Control "public";
    }

    location /nexfit/api/ {
        include /etc/nginx/snippets/nexfit-origin-token-check.conf;
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $public_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $public_host;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location /nexfit/ {
        include /etc/nginx/snippets/nexfit-origin-token-check.conf;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $public_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $public_host;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location / {
        return 404;
    }
}

# =============================================================================
# uploads.metodosk.com  (DNS-only, sin proxy Cloudflare, sin Worker)
# Acceso directo del navegador. NO exige X-Nexfit-Origin-Token.
# Protección: path restringido, POST/OPTIONS, JWT/cookie, CORS, CSRF, 300M.
# =============================================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name uploads.metodosk.com;

    # PLACEHOLDER: certbot --nginx -d uploads.metodosk.com
    ssl_certificate /etc/letsencrypt/live/uploads.metodosk.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/uploads.metodosk.com/privkey.pem;

    client_max_body_size 300M;

    location ~ ^/nexfit/api/admin/exercises/[^/]+/upload-video/?$ {
        rewrite ^/nexfit/api/(.*)$ /api/$1 break;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host uploads.metodosk.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host uploads.metodosk.com;
        proxy_set_header Origin $http_origin;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        client_max_body_size 300M;
        limit_except POST OPTIONS {
            deny all;
        }
    }

    location / {
        return 404;
    }
}
