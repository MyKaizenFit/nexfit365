name: Quality Checks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run critical backend tests
        env:
          DEBUG: "False"
          SECRET_KEY: "ci-secret-key"
          DB_NAME: test_db
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: 5432
          DB_SSLMODE: disable
          REDIS_URL: redis://localhost:6379/0
        run: |
          # Curated critical path. Admin nutrition + admin workout files fully green.
          # Remaining work (audit 006): expand toward `pytest -q` for the whole suite.
          pytest \
            accounts/tests/test_profile_plan_integration.py \
            accounts/tests/test_copy_preserves_source_plans.py \
            accounts/tests/test_default_plan_auto_provision.py \
            accounts/tests/test_default_plan_display_names.py \
            api/tests/test_auth.py \
            nutrition/tests/test_services.py \
            nutrition/tests/test_plan_meal_utils.py \
            nutrition/tests/test_plan_week_sync_db.py \
            nutrition/tests/test_plan_week_sync.py \
            nutrition/tests/test_admin_nutrition_views.py \
            nutrition/tests/test_community_posts.py \
            nutrition/tests/test_shopping_list_service.py \
            accounts/tests/test_user_management.py \
            progress/tests/test_views_extra.py \
            progress/tests/test_views.py \
            progress/tests/test_rest_wellness.py \
            progress/tests/test_local_calendar_date.py \
            progress/tests/test_photo_mime_validation.py \
            progress/tests/test_protected_media.py \
            achievements/tests/test_views.py \
            dashboard/tests/test_html_sanitize.py \
            workouts/test_workouts_models.py \
            workouts/tests/test_workout_views.py \
            workouts/tests/test_workout_week_utils.py \
            workouts/tests/test_admin_workout_views.py \
            workouts/tests/test_program_lifecycle.py \
            progress/tests/test_models.py \
            -q

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps

      - name: Run frontend unit tests
        run: npm test -- --ci --coverage=false

      - name: Run frontend checks
        run: npm run check
