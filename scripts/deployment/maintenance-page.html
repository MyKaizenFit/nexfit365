<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="refresh" content="60">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <title>NexFit - Migración de dominio en curso</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #fff7ed;
      --panel: #ffffff;
      --ink: #111827;
      --muted: #6b7280;
      --line: #fed7aa;
      --accent: #f97316;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 20%, rgba(249, 115, 22, 0.12), transparent 28rem),
        radial-gradient(circle at 90% 10%, rgba(20, 184, 166, 0.10), transparent 24rem),
        var(--bg);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(680px, 100%);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 24px 70px rgba(17, 24, 39, 0.12);
      padding: clamp(28px, 6vw, 52px);
    }

    .brand {
      margin: 0 0 28px;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.28em;
      color: var(--accent);
    }

    h1 {
      margin: 0 0 16px;
      font-size: clamp(28px, 6vw, 42px);
      line-height: 1.1;
    }

    p {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: clamp(16px, 2.4vw, 19px);
      line-height: 1.6;
    }

    p:last-child { margin-bottom: 0; }
  </style>
</head>
<body>
  <main>
    <p class="brand">NEXFIT</p>
    <h1>Migración de dominio en curso</h1>
    <p>
      Estamos migrando NexFit a nuestro nuevo dominio y realizando las últimas
      comprobaciones.
    </p>
    <p>
      El acceso estará temporalmente no disponible durante unos minutos.
    </p>
    <p>
      Volveremos a estar operativos lo antes posible.
      Gracias por tu paciencia.
    </p>
  </main>
</body>
</html>
